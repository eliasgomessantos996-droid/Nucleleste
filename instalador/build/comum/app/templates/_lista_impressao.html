<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{% block titulo %}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
  @page { size: A4 {% block orientacao %}portrait{% endblock %}; margin: 12mm; }
  body { background: #fff; font-size: 12px; }
  .pagina { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .cab { display: flex; align-items: center; gap: 16px; border-bottom: 2px solid var(--verde); padding-bottom: 8px; margin-bottom: 12px; }
  .cab img { height: 54px; }
  .cab h1 { font-size: 18px; margin: 0; }
  .cab p { margin: 2px 0 0; color: var(--suave); }
  table.lista { width: 100%; border-collapse: collapse; }
  .lista th, .lista td { border: 1px solid #999; padding: 4px 6px; text-align: left; }
  .lista th { background: #eee; }
  .lista td.num, .lista th.num { text-align: right; }
  .assinaturas { display: flex; gap: 40px; margin-top: 50px; }
  .assinaturas div { flex: 1; border-top: 1px solid #000; text-align: center; padding-top: 4px; }
  @media print { .nao-imprimir { display: none; } .pagina { padding: 0; } }
</style>
</head>
<body>
<div class="pagina">
  <div class="nao-imprimir acoes" style="margin:0 0 12px">
    <button class="btn" onclick="window.print()">Imprimir</button>
    <a class="btn sec" href="javascript:history.back()">Voltar</a>
  </div>
  <div class="cab">
    <img src="{{ url_for('static', filename='img/logo.jpeg') }}" alt="">
    <div><h1>{{ self.titulo() }}</h1><p>{% block subtitulo %}{% endblock %}</p></div>
  </div>
  {% block conteudo %}{% endblock %}
</div>
<script>if (/[?&]auto=1(&|$)/.test(location.search)) window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 400); });</script>
</body>
</html>
