<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartaz da pesquisa de satisfação</title>
<style>
  @page { size: A4 portrait; margin: 14mm; }
  body { font-family: Verdana, Arial, sans-serif; color: #111; text-align: center; margin: 0; padding: 24px; }
  h1 { font-size: 30px; margin: 10px 0 4px; }
  .clinica { font-size: 15px; color: #444; margin-bottom: 18px; }
  .qr { width: 380px; height: 380px; margin: 14px auto; border: 3px solid #1f7a4d; border-radius: 14px; padding: 10px; }
  .passos { font-size: 18px; margin: 14px auto; max-width: 520px; text-align: left; line-height: 1.6; }
  .wifi { margin-top: 10px; font-size: 16px; font-weight: bold; background: #eaf5ef; border-radius: 10px; padding: 10px; }
  .link { font-size: 13px; color: #555; margin-top: 12px; word-break: break-all; }
  .barra { margin-bottom: 14px; } .barra button { font-size: 16px; padding: 8px 18px; }
  @media print { .barra { display: none; } }
</style>
</head>
<body>
<div class="barra"><button onclick="window.print()">🖨 Imprimir</button></div>
<h1>Sua opinião é importante!</h1>
<div class="clinica">{{ clinica }}</div>
<img class="qr" src="{{ url_for('qual.satisf_qr') }}" alt="QR Code da pesquisa de satisfação">
<div class="passos">
  <b>1.</b> Conecte o celular ao <b>Wi-Fi da clínica</b>.<br>
  <b>2.</b> Aponte a câmera para o QR Code.<br>
  <b>3.</b> Responda em menos de 1 minuto.
</div>
<div class="wifi">A pesquisa só abre conectado à rede interna da clínica.</div>
<div class="link">{{ link }}</div>
<script>if (location.search.indexOf('auto=1') >= 0) window.print();</script>
</body>
</html>
